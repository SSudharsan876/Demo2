<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prompt Forge | Participant Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">⚡</div>

        <!-- Heading -->
        <h1>Prompt Forge</h1>

        <p>Participant Login</p>

        <!-- Participant Login -->
        <input
            type="email"
            id="email"
            placeholder="Registered Email Address"
            required
        >

        <button
            class="btn btn-primary"
            onclick="login()">
            Enter Competition
        </button>

        <!-- Registration Link -->
        <p class="auth-link">
            Not registered?
            <a href="register.html">Register Here</a>
        </p>
        <!-- Hidden Admin Login -->
<div id="adminBox" style="display:none; margin-top:20px;">

    <h3>Admin Login</h3>

    <input
        type="text"
        id="adminUsername"
        placeholder="Admin Username"
    >

    <input
        type="password"
        id="adminPassword"
        placeholder="Admin Password"
    >

    <button
        class="btn btn-primary"
        onclick="adminLogin()">
        Login as Admin
    </button>

</div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Admin Login -->
        <p class="admin-link">
            <a href="#" onclick="showAdminLogin(); return false;">
                🔐 Admin Login
            </a>
        </p>

        <!-- Admin Login Box -->
        <div id="adminBox" style="display: none; margin-top: 20px;">

            <h3 style="margin-bottom: 15px;">
                Admin Login
            </h3>

            <input
                type="text"
                id="adminUsername"
                placeholder="Admin Username"
            >

            <input
                type="password"
                id="adminPassword"
                placeholder="Admin Password"
            >

            <button
                class="btn btn-primary"
                onclick="adminLogin()">
                Login as Admin
            </button>

        </div>

    </div>


    <!-- =========================
         FIREBASE
    ========================== -->

    <script type="module">

        import { db } from "./firebase.js";

        import {
            collection,
            query,
            where,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // =====================================
        // PARTICIPANT LOGIN
        // =====================================

        window.login = async function () {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            if (!email) {

                alert("Enter your registered email");

                return;
            }


            try {

                const q = query(
                    collection(db, "users"),
                    where("email", "==", email)
                );


                const snapshot =
                    await getDocs(q);


                // Email not registered

                if (snapshot.empty) {

                    alert("Email not registered");

                    return;
                }


                // Get user

                const user =
                    snapshot.docs[0].data();


                // Check admin approval

                if (!user.emailApproved) {

                    alert(
                        "Waiting for admin approval"
                    );

                    return;
                }


                // Save participant details

                localStorage.setItem(
                    "currentUser",
                    user.fullName
                );

                localStorage.setItem(
                    "currentEmail",
                    user.email
                );


                // Enter competition

                window.location.href =
                    "battle.html";

            }

            catch (error) {

                console.error(error);

                alert(
                    "Login failed: " +
                    error.message
                );

            }

        };


        // =====================================
        // SHOW / HIDE ADMIN LOGIN
        // =====================================

        window.showAdminLogin = function () {

            const box =
                document.getElementById("adminBox");


            if (box.style.display === "none") {

                box.style.display = "block";

            } else {

                box.style.display = "none";

            }

        };


        // =====================================
        // ADMIN LOGIN
        // =====================================

        window.adminLogin = function () {

            const username =
                document
                    .getElementById("adminUsername")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("adminPassword")
                    .value;


            // Admin credentials

            const ADMIN_USERNAME = "admin";

            const ADMIN_PASSWORD = "promptforge2026";


            if (
                username === ADMIN_USERNAME &&
                password === ADMIN_PASSWORD
            ) {

                // Save admin session

                localStorage.setItem(
                    "admin",
                    "true"
                );


                // Open admin dashboard

                window.location.href =
                    "admin.html";

            }

            else {

                alert(
                    "Invalid admin username or password"
                );

            }

        };

    </script>

</body>

</html>
