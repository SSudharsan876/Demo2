<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prompt Forge | Participant Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">⚡</div>

        <!-- Heading -->
        <h1>Prompt Forge</h1>

        <p>Participant Login</p>


        <!-- =====================================
             PARTICIPANT LOGIN
        ====================================== -->

        <input
            type="email"
            id="email"
            placeholder="Registered Email Address"
            required
        >

        <button
            class="btn btn-primary"
            onclick="login()">
            Enter Competition
        </button>


        <!-- =====================================
             REGISTRATION LINK
        ====================================== -->

        <p class="auth-link">
            Not registered?
            <a href="register.html">Register Here</a>
        </p>


        <!-- =====================================
             HIDDEN ADMIN LOGIN
             
             This is NOT visible normally.
             Press Ctrl + Shift + A
        ====================================== -->

        <div
            id="adminBox"
            style="
                display: none;
                margin-top: 25px;
                padding-top: 20px;
                border-top: 1px solid rgba(255,255,255,0.15);
            "
        >

            <h3>🔐 Admin Login</h3>

            <input
                type="text"
                id="adminUsername"
                placeholder="Admin Username"
                autocomplete="username"
            >

            <input
                type="password"
                id="adminPassword"
                placeholder="Admin Password"
                autocomplete="current-password"
            >

            <button
                class="btn btn-primary"
                onclick="adminLogin()">
                Login as Admin
            </button>

            <p
                id="adminMsg"
                style="margin-top: 10px;">
            </p>

        </div>

    </div>


    <!-- ==========================================
         FIREBASE + LOGIN JAVASCRIPT
    =========================================== -->

    <script type="module">

        // =====================================
        // FIREBASE
        // =====================================

        import { db } from "./firebase.js";

        import {
            collection,
            query,
            where,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // =====================================
        // PARTICIPANT LOGIN
        // =====================================

        window.login = async function () {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            // Check email

            if (!email) {

                alert(
                    "Enter your registered email"
                );

                return;
            }


            try {

                // Search Firebase users collection

                const q = query(
                    collection(db, "users"),
                    where("email", "==", email)
                );


                const snapshot =
                    await getDocs(q);


                // =====================================
                // EMAIL NOT REGISTERED
                // =====================================

                if (snapshot.empty) {

                    alert(
                        "Email not registered"
                    );

                    return;
                }


                // =====================================
                // GET USER
                // =====================================

                const user =
                    snapshot.docs[0].data();


                // =====================================
                // CHECK ADMIN APPROVAL
                // =====================================

                if (!user.emailApproved) {

                    alert(
                        "Waiting for admin approval"
                    );

                    return;
                }


                // =====================================
                // SAVE PARTICIPANT DETAILS
                // =====================================

                localStorage.setItem(
                    "currentUser",
                    user.fullName
                );


                localStorage.setItem(
                    "currentEmail",
                    user.email
                );


                // =====================================
                // ENTER COMPETITION
                // =====================================

                window.location.href =
                    "battle.html";

            }


            catch (error) {

                console.error(
                    "Participant login error:",
                    error
                );


                alert(
                    "Login failed: " +
                    error.message
                );

            }

        };


        // =====================================
        // HIDDEN ADMIN LOGIN
        // =====================================
        //
        // Shortcut:
        // Ctrl + Shift + A
        //
        // The admin option remains invisible
        // until this shortcut is pressed.
        // =====================================

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.ctrlKey &&
                    event.shiftKey &&
                    event.key.toLowerCase() === "a"
                ) {

                    const adminBox =
                        document.getElementById(
                            "adminBox"
                        );


                    // Show admin login

                    adminBox.style.display =
                        "block";


                    // Focus username

                    document
                        .getElementById(
                            "adminUsername"
                        )
                        .focus();

                }

            }
        );


        // =====================================
        // ADMIN LOGIN
        // =====================================

        window.adminLogin = async function () {

            const username =
                document
                    .getElementById(
                        "adminUsername"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "adminPassword"
                    )
                    .value;


            const adminMsg =
                document.getElementById(
                    "adminMsg"
                );


            // =====================================
            // VALIDATE INPUT
            // =====================================

            if (!username || !password) {

                adminMsg.innerText =
                    "Enter username and password";

                return;
            }


            adminMsg.innerText =
                "Checking login...";


            try {

                // =====================================
                // SEND LOGIN TO SERVER.JS
                // =====================================

                const response =
                    await fetch(
                        "/admin-login",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                username:
                                    username,

                                password:
                                    password

                            })

                        }
                    );


                const data =
                    await response.json();


                // =====================================
                // SUCCESS
                // =====================================

                if (data.success) {

                    // Save admin session

                    localStorage.setItem(
                        "admin",
                        "true"
                    );


                    // Open admin dashboard

                    window.location.href =
                        "admin.html";

                }


                // =====================================
                // FAILED LOGIN
                // =====================================

                else {

                    adminMsg.innerText =
                        data.message ||
                        "Invalid admin username or password";

                }

            }


            catch (error) {

                console.error(
                    "Admin login error:",
                    error
                );


                adminMsg.innerText =
                    "Unable to connect to server";

            }

        };

    </script>

</body>

</html>
