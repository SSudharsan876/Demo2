<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prompt Forge | Participant Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">

    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
            ⚡
        </div>


        <!-- Heading -->
        <h1>
            Prompt Forge
        </h1>


        <p>
            Participant Login
        </p>


        <!-- Participant Email -->
        <input
            type="email"
            id="email"
            placeholder="Registered Email Address"
            autocomplete="email"
            required
        >


        <!-- Login Button -->
        <button
            class="btn btn-primary"
            id="loginBtn"
            onclick="login()"
        >
            Enter Competition
        </button>


        <!-- Registration -->
        <p class="auth-link">

            Not registered?

            <a href="register.html">
                Register Here
            </a>

        </p>

    </div>


    <!-- ==========================================
         FIREBASE PARTICIPANT LOGIN
    =========================================== -->

    <script type="module">

        import { db } from "./firebase.js";


        import {
            collection,
            query,
            where,
            getDocs
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // ==========================================
        // PARTICIPANT LOGIN
        // ==========================================

        window.login = async function () {

            const emailInput =
                document.getElementById("email");


            const loginBtn =
                document.getElementById("loginBtn");


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            // Empty email

            if (!email) {

                alert(
                    "Enter your registered email"
                );

                emailInput.focus();

                return;
            }


            loginBtn.disabled = true;

            loginBtn.innerText =
                "Checking...";


            try {

                // Find participant

                const q = query(

                    collection(
                        db,
                        "users"
                    ),

                    where(
                        "email",
                        "==",
                        email
                    )

                );


                const snapshot =
                    await getDocs(q);


                // Not registered

                if (snapshot.empty) {

                    alert(
                        "Email not registered"
                    );

                    return;
                }


                // Get participant data

                const user =
                    snapshot.docs[0].data();


                // Check approval

                if (
                    user.emailApproved !== true
                ) {

                    alert(
                        "Waiting for admin approval"
                    );

                    return;
                }


                // Save participant

                localStorage.setItem(
                    "currentUser",
                    user.fullName || ""
                );


                localStorage.setItem(
                    "currentEmail",
                    user.email || email
                );


                // Enter competition

                window.location.href =
                    "battle.html";

            }


            catch (error) {

                console.error(
                    "Participant login error:",
                    error
                );


                alert(
                    "Login failed: " +
                    error.message
                );

            }


            finally {

                loginBtn.disabled = false;

                loginBtn.innerText =
                    "Enter Competition";

            }

        };


        // ==========================================
        // HIDDEN ADMIN SHORTCUT
        //
        // CTRL + SHIFT + A
        // ==========================================

        document.addEventListener(
            "keydown",
            function (event) {

                if (

                    event.ctrlKey &&

                    event.shiftKey &&

                    event.key.toLowerCase() === "a"

                ) {

                    event.preventDefault();


                    window.location.href =
                        "admin-login.html";

                }

            }
        );

    </script>

</body>

</html>
