<!DOCTYPE html>

<html>
<head>
    <title>Prompt Forge - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

```
<h1>⚡ Prompt Forge</h1>
<h2>Participant Login</h2>

<input type="email" id="email" placeholder="Registered Email Address">

<button onclick="login()">Enter Competition</button>

<p>Not registered? <a href="register.html">Register Here</a></p>

<hr style="margin:30px 0;">

<p><a href="#" onclick="showAdminLogin()">🔐 Admin Login</a></p>

<div id="adminBox" style="display:none; margin-top:20px;">

    <h3>Admin Login</h3>

    <input type="text" id="adminUsername" placeholder="Admin Username">

    <input type="password" id="adminPassword" placeholder="Admin Password">

    <button onclick="adminLogin()">Login as Admin</button>

</div>
```

</div>

<script type="module">

import { db } from "./firebase.js";

import {

    collection,
    query,
    where,
    getDocs

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ---------------- PARTICIPANT LOGIN ----------------

window.login = async function(){

    const email =

    document.getElementById("email").value.trim().toLowerCase();

    if(!email){

        alert("Enter your registered email");

        return;

    }

    const q = query(

        collection(db, "users"),

        where("email", "==", email)

    );

    const snapshot = await getDocs(q);

    if(snapshot.empty){

        alert("Email not registered");

        return;

    }

    const user = snapshot.docs[0].data();

    if(!user.emailApproved){

        alert("Waiting for admin approval");

        return;

    }

    // Save participant details

    localStorage.setItem("currentUser", user.fullName);

    localStorage.setItem("currentEmail", user.email);

    window.location.href = "battle.html";

};


// ---------------- SHOW ADMIN LOGIN ----------------

window.showAdminLogin = function(){

    const box = document.getElementById("adminBox");

    box.style.display =

    box.style.display === "none" ? "block" : "none";

};


// ---------------- ADMIN LOGIN ----------------

window.adminLogin = function(){

    const username =

    document.getElementById("adminUsername").value.trim();

    const password =

    document.getElementById("adminPassword").value;

    // Admin credentials

    const ADMIN_USERNAME = "admin";

    const ADMIN_PASSWORD = "promptforge2026";

    if(username === ADMIN_USERNAME && password === ADMIN_PASSWORD){

        localStorage.setItem("admin", "true");

        window.location.href = "admin.html";

    }

    else{

        alert("Invalid admin username or password");

    }

};

</script>

</body>
</html>
