<body class="auth-page">

```
<div class="auth-card">

    <!-- Logo -->

    <div class="auth-logo">
        ⚡
    </div>


    <!-- Heading -->

    <h1>
        Prompt Forge
    </h1>


    <p>
        Participant Login
    </p>


    <!-- Email -->

    <input
        type="email"
        id="email"
        placeholder="Registered Email Address"
        autocomplete="email"
        required
    >


    <!-- Login Button -->

    <button
        class="btn btn-primary"
        id="loginBtn"
    >
        Enter Competition
    </button>


    <!-- Registration -->

    <p class="auth-link">

        Not registered?

        <a href="register.html">
            Register Here
        </a>

    </p>

</div>


<script type="module">

    /* =====================================================
       FIREBASE
    ===================================================== */

    import { db } from "./firebase.js";

    import {
        collection,
        query,
        where,
        getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const emailInput =
        document.getElementById("email");

    const loginBtn =
        document.getElementById("loginBtn");


    /* =====================================================
       PARTICIPANT LOGIN
    ===================================================== */

    async function loginParticipant() {

        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        /* =================================================
           VALIDATION
        ================================================= */

        if (!email) {

            alert(
                "Enter your registered email"
            );

            emailInput.focus();

            return;

        }


        loginBtn.disabled = true;

        loginBtn.innerText =
            "Checking...";


        try {

            /* =============================================
               FIND PARTICIPANT
            ============================================= */

            const q =
                query(
                    collection(
                        db,
                        "users"
                    ),

                    where(
                        "email",
                        "==",
                        email
                    )
                );


            const snapshot =
                await getDocs(q);


            /* =============================================
               NOT REGISTERED
            ============================================= */

            if (snapshot.empty) {

                alert(
                    "Email not registered"
                );

                return;

            }


            /* =============================================
               GET PARTICIPANT DATA
            ============================================= */

            const user =
                snapshot.docs[0].data();


            /* =============================================
               CHECK ADMIN APPROVAL
            ============================================= */

            if (
                user.emailApproved !== true
            ) {

                alert(
                    "Waiting for admin approval"
                );

                return;

            }


            /* =============================================
               CLEAR OLD SESSION
            ============================================= */

            localStorage.removeItem(
                "submissionCompleted"
            );

            localStorage.removeItem(
                "timerStart"
            );


            /* =============================================
               SAVE PARTICIPANT
            ============================================= */

            localStorage.setItem(
                "currentUser",
                user.fullName || "Participant"
            );


            localStorage.setItem(
                "currentEmail",
                user.email || email
            );


            /* =============================================
               START 20 MINUTE TIMER
            ============================================= */

            const timerStart =
                Date.now();


            localStorage.setItem(
                "timerStart",
                timerStart.toString()
            );


            /* =============================================
               OPEN COMPETITION
            ============================================= */

            window.location.href =
                "battle.html";

        }


        catch (error) {

            console.error(
                "Participant login error:",
                error
            );


            alert(
                "Login failed:\n\n" +
                error.message
            );

        }


        finally {

            loginBtn.disabled = false;

            loginBtn.innerText =
                "Enter Competition";

        }

    }


    /* =====================================================
       LOGIN BUTTON
    ===================================================== */

    loginBtn.addEventListener(
        "click",
        loginParticipant
    );


    /* =====================================================
       ENTER KEY
    ===================================================== */

    emailInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                loginParticipant();

            }

        }
    );

</script>
```

</body>

</html>
