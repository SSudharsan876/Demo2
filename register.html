<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Forge | Participant Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-card">

```
<div class="auth-logo">⚡</div>

<h1>Prompt Forge</h1>

<p>Participant Registration</p>

<input type="text" id="name" placeholder="Full Name" required>

<input type="text" id="college" placeholder="College Name" required>

<input type="text" id="department" placeholder="Department" required>

<input type="email" id="email" placeholder="Email Address" required>

<input type="text" id="phone" placeholder="Phone Number" required>

<button class="btn btn-primary" onclick="registerUser()">Register Now</button>

<p class="auth-link">
  Already registered?
  <a href="login.html">Login Here</a>
</p>
```

  </div>

  <script type="module">

    import { db } from './firebase.js';

    import {
      collection,
      addDoc,
      query,
      where,
      getDocs
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    window.registerUser = async function(){

      const fullName = document.getElementById('name').value.trim();
      const college = document.getElementById('college').value.trim();
      const department = document.getElementById('department').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const phone = document.getElementById('phone').value.trim();

      if(!fullName || !college || !department || !email || !phone){
        alert('Please fill all fields');
        return;
      }

      try{

        const q = query(
          collection(db,'users'),
          where('email','==',email)
        );

        const existing = await getDocs(q);

        if(!existing.empty){
          alert('Email already registered');
          return;
        }

        await addDoc(collection(db,'users'),{
          fullName,
          college,
          department,
          email,
          phone,
          emailApproved:false,
          registeredAt:new Date().toLocaleString()
        });

        alert('Registration successful. Wait for admin approval.');

        window.location.href = 'login.html';

      }

      catch(error){

        console.error(error);

        alert('Registration failed: ' + error.message);

      }

    };

  </script>

</body>
</html>
