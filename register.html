```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prompt Forge | Participant Registration</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <div class="auth-card">

        <div class="auth-logo">
            ⚡
        </div>


        <h1>
            Prompt Forge
        </h1>


        <p>
            Participant Registration
        </p>


        <!-- ======================================
             FULL NAME
        ======================================= -->

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            autocomplete="name"
            required
        >


        <!-- ======================================
             COLLEGE
        ======================================= -->

        <input
            type="text"
            id="college"
            placeholder="College Name"
            required
        >


        <!-- ======================================
             DEPARTMENT
        ======================================= -->

        <input
            type="text"
            id="department"
            placeholder="Department"
            required
        >


        <!-- ======================================
             EMAIL
        ======================================= -->

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            autocomplete="email"
            required
        >


        <!-- ======================================
             PHONE
        ======================================= -->

        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel"
            required
        >


        <!-- ======================================
             REGISTER BUTTON
        ======================================= -->

        <button
            type="button"
            id="registerBtn"
            class="btn btn-primary"
        >
            Register Now
        </button>


        <p class="auth-link">

            Already registered?

            <a href="login.html">
                Login Here
            </a>

        </p>


    </div>


    <script>


        // ==========================================
        // ELEMENTS
        // ==========================================

        const registerBtn =
            document.getElementById("registerBtn");


        const nameInput =
            document.getElementById("name");


        const collegeInput =
            document.getElementById("college");


        const departmentInput =
            document.getElementById("department");


        const emailInput =
            document.getElementById("email");


        const phoneInput =
            document.getElementById("phone");


        // ==========================================
        // PHONE - NUMBERS ONLY
        // ==========================================

        phoneInput.addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(/[^0-9]/g, "")
                        .slice(0, 10);

            }
        );


        // ==========================================
        // REGISTER
        // ==========================================

        registerBtn.addEventListener(
            "click",
            async function () {


                // ----------------------------------
                // GET VALUES
                // ----------------------------------

                const fullName =
                    nameInput.value.trim();


                const college =
                    collegeInput.value.trim();


                const department =
                    departmentInput.value.trim();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                const phone =
                    phoneInput.value.trim();


                // ----------------------------------
                // EMPTY FIELD CHECK
                // ----------------------------------

                if (
                    !fullName ||
                    !college ||
                    !department ||
                    !email ||
                    !phone
                ) {

                    alert(
                        "Please fill all fields."
                    );

                    return;

                }


                // ----------------------------------
                // GMAIL VALIDATION
                // ----------------------------------

                const gmailPattern =
                    /^[a-zA-Z0-9._%+-]+@gmail\.com$/;


                if (
                    !gmailPattern.test(email)
                ) {

                    alert(
                        "Please enter a valid Gmail address."
                    );

                    emailInput.focus();

                    return;

                }


                // ----------------------------------
                // PHONE VALIDATION
                // ----------------------------------

                const phonePattern =
                    /^[0-9]{10}$/;


                if (
                    !phonePattern.test(phone)
                ) {

                    alert(
                        "Please enter exactly 10 digits for the phone number."
                    );

                    phoneInput.focus();

                    return;

                }


                // ----------------------------------
                // DISABLE BUTTON
                // ----------------------------------

                registerBtn.disabled =
                    true;


                registerBtn.innerText =
                    "Registering...";


                try {


                    // =================================
                    // SEND TO EXPRESS BACKEND
                    // =================================

                    const response =
                        await fetch(
                            "/register",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        fullName:
                                            fullName,

                                        college:
                                            college,

                                        department:
                                            department,

                                        email:
                                            email,

                                        phone:
                                            phone

                                    })

                            }
                        );


                    // =================================
                    // CHECK SERVER RESPONSE
                    // =================================

                    if (!response.ok) {

                        throw new Error(
                            "Server returned HTTP " +
                            response.status
                        );

                    }


                    const data =
                        await response.json();


                    // =================================
                    // REGISTRATION FAILED
                    // =================================

                    if (!data.success) {

                        alert(
                            data.message ||
                            "Registration failed."
                        );

                        return;

                    }


                    // =================================
                    // SUCCESS
                    // =================================

                    alert(
                        "✅ Registration successful!\n\n" +
                        "Please wait for admin approval."
                    );


                    // =================================
                    // REDIRECT
                    // =================================

                    window.location.href =
                        "login.html";


                }

                catch (error) {


                    console.error(
                        "Registration error:",
                        error
                    );


                    alert(
                        "❌ Registration failed.\n\n" +
                        "Make sure the Prompt Forge server is running."
                    );

                }

                finally {


                    registerBtn.disabled =
                        false;


                    registerBtn.innerText =
                        "Register Now";

                }

            }
        );

    </script>


</body>

</html>
```
