<script type="module">
import { db, storage } from "./firebase.js";
import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

// Show participant
document.getElementById("user").innerText =
  "Participant: " + (localStorage.getItem("currentUser") || "Guest");

// Generate Canva AI
window.generateDesign = function () {
  const prompt = document.getElementById("prompt").value.trim();

  if (!prompt) {
    alert("Enter your design prompt");
    return;
  }

  const canvaLink =
    `https://www.canva.com/ai-image-generator/?prompt=${encodeURIComponent(prompt)}`;

  window.open(canvaLink, "_blank");

  document.getElementById("loading").innerText =
    "Canva AI opened in a new tab. Generate the design, download it, and upload it below.";
};

// Preview image
const imageInput = document.getElementById("imageUpload");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    preview.src = event.target.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

// Submit design
window.submitDesign = async function () {
  alert("Button clicked"); // test

  const file = imageInput.files[0];
  if (!file) {
    alert("Please upload an image first");
    return;
  }

  try {
    const imageRef = ref(storage, `submissions/${Date.now()}_${file.name}`);

    await uploadBytes(imageRef, file);

    const imageUrl = await getDownloadURL(imageRef);

    await addDoc(collection(db, "submissions"), {
      participant: localStorage.getItem("currentUser") || "Guest",
      email: localStorage.getItem("currentEmail") || "",
      prompt: document.getElementById("prompt").value.trim(),
      image: imageUrl,
      submittedAt: new Date().toLocaleString()
    });

    alert("🎉 Design submitted successfully!");

  } catch (error) {
    console.error(error);
    alert("Submission failed: " + error.message);
  }
};
</script>
