<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Forge | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

```
<div class="workspace-header">

    <div>
        <span class="badge">Admin Panel</span>
        <h1>Prompt Forge Dashboard</h1>
        <p>Approve participants and review submitted AI designs.</p>
    </div>

    <button id="refreshBtn" class="btn btn-primary">Refresh Data</button>

</div>

<hr>

<h2>Participant Approval</h2>

<div class="table-wrapper">

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>College</th>
                <th>Department</th>
                <th>Email</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="table"></tbody>

    </table>

</div>

<hr>

<h2>Submitted Designs</h2>

<div id="submissions"></div>
```

</div>

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ---------------- LOAD USERS ----------------

async function loadUsers(){

    const tbody = document.getElementById("table");

    tbody.innerHTML = "";

    try{

        const snapshot = await getDocs(collection(db, "users"));

        snapshot.forEach((userDoc)=>{

            const u = userDoc.data();

            // Show only pending participants
            if(u.emailApproved) return;

            tbody.innerHTML += `
                <tr>

                    <td>${u.fullName || ""}</td>

                    <td>${u.college || ""}</td>

                    <td>${u.department || ""}</td>

                    <td>${u.email || ""}</td>

                    <td>Pending</td>

                    <td>
                        <button class="btn btn-primary approve-btn" data-id="${userDoc.id}">
                            Approve
                        </button>
                    </td>

                </tr>
            `;

        });

        // Approve buttons

        document.querySelectorAll(".approve-btn").forEach(btn=>{

            btn.addEventListener("click", async ()=>{

                const id = btn.getAttribute("data-id");

                await updateDoc(doc(db, "users", id),{

                    emailApproved:true

                });

                // Reload table without alert

                loadUsers();

            });

        });

    }

    catch(error){

        console.error(error);

        alert("Failed to load users");

    }

}


// ---------------- LOAD SUBMISSIONS ----------------

async function loadSubmissions(){

    const box = document.getElementById("submissions");

    box.innerHTML = "";

    try{

        const snapshot = await getDocs(collection(db, "submissions"));

        if(snapshot.empty){

            box.innerHTML = "<p>No designs submitted yet.</p>";

            return;

        }

        snapshot.forEach((designDoc)=>{

            const d = designDoc.data();

            box.innerHTML += `
                <div class="design-card" style="margin-top:20px; background:#334155; padding:20px; border-radius:12px;">

                    <h3>${d.participant || "Participant"}</h3>

                    <p><b>Email:</b> ${d.email || ""}</p>

                    <p><b>Prompt:</b> ${d.prompt || ""}</p>

                    <p><b>Submitted:</b> ${d.submittedAt || ""}</p>

                    <img src="${d.image}" style="width:300px; border-radius:10px;" alt="Submitted Design">

                    <br><br>

                    <a href="${d.image}" target="_blank">
                        <button class="btn btn-secondary">View Design</button>
                    </a>

                    <button class="btn btn-danger delete-btn" data-id="${designDoc.id}" style="margin-left:10px;">
                        Delete
                    </button>

                </div>
            `;

        });

        // Delete buttons

        document.querySelectorAll(".delete-btn").forEach(btn=>{

            btn.addEventListener("click", async ()=>{

                const id = btn.getAttribute("data-id");

                const ok = confirm("Delete this submission?");

                if(!ok) return;

                await deleteDoc(doc(db, "submissions", id));

                loadSubmissions();

            });

        });

    }

    catch(error){

        console.error(error);

        alert("Failed to load submissions");

    }

}


// ---------------- REFRESH ----------------

async function refreshData(){

    await loadUsers();

    await loadSubmissions();

}

document.getElementById("refreshBtn").addEventListener("click", refreshData);


// ---------------- INITIAL LOAD ----------------

refreshData();

</script>

</body>
</html>
