<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prompt Forge | Admin Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">


    <!-- ==========================================
         HEADER
    =========================================== -->

    <div class="workspace-header">

        <div>

            <span class="badge">
                Admin Panel
            </span>

            <h1>
                Prompt Forge Dashboard
            </h1>

            <p>
                Approve participants and review
                submitted AI designs.
            </p>

            <p
                id="adminEmail"
                style="font-size:14px;"
            ></p>

        </div>


        <div
            style="
                display:flex;
                gap:10px;
            "
        >

            <button
                id="refreshBtn"
                class="btn btn-primary"
            >
                Refresh Data
            </button>


            <button
                id="logoutBtn"
                class="btn btn-danger"
            >
                Logout
            </button>

        </div>

    </div>


    <hr>


    <!-- ==========================================
         PARTICIPANT APPROVAL
    =========================================== -->

    <h2>
        Participant Approval
    </h2>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>
                        Name
                    </th>

                    <th>
                        College
                    </th>

                    <th>
                        Department
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="table">

                <tr>

                    <td colspan="6">
                        Loading participants...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <hr>


    <!-- ==========================================
         SUBMITTED DESIGNS
    =========================================== -->

    <h2>
        Submitted Designs
    </h2>


    <div id="submissions">

        <p>
            Loading submissions...
        </p>

    </div>


</div>



<!-- ==========================================
     FIREBASE
=========================================== -->

<script type="module">


    // ==========================================
    // IMPORT FIREBASE
    // ==========================================

    import {
        auth,
        db
    } from "./firebase.js";


    import {
        onAuthStateChanged,
        signOut
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        collection,
        getDocs,
        doc,
        updateDoc,
        deleteDoc
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



    // ==========================================
    // ADMIN EMAIL
    // ==========================================

    const ADMIN_EMAIL =
        "promptforgeadmin@gmail.com";



    // ==========================================
    // PAGE ELEMENTS
    // ==========================================

    const table =
        document.getElementById("table");


    const submissions =
        document.getElementById("submissions");


    const refreshBtn =
        document.getElementById("refreshBtn");


    const logoutBtn =
        document.getElementById("logoutBtn");


    const adminEmail =
        document.getElementById("adminEmail");



    // ==========================================
    // AUTHENTICATION CHECK
    // ==========================================

    onAuthStateChanged(
        auth,
        async function(user) {

            // No Firebase user

            if (!user) {

                window.location.href =
                    "admin-login.html";

                return;

            }


            // Check admin email

            if (
                user.email !==
                ADMIN_EMAIL
            ) {

                alert(
                    "You are not authorized to access the admin dashboard."
                );


                await signOut(auth);


                window.location.href =
                    "admin-login.html";

                return;

            }


            // Show admin email

            adminEmail.innerText =
                "Logged in as: " +
                user.email;


            // Load dashboard

            await refreshData();

        }
    );



    // ==========================================
    // LOAD USERS
    // ==========================================

    async function loadUsers() {


        table.innerHTML = `

            <tr>

                <td colspan="6">
                    Loading participants...
                </td>

            </tr>

        `;


        try {


            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "users"
                    )
                );


            table.innerHTML = "";


            // No users

            if (
                snapshot.empty
            ) {

                table.innerHTML = `

                    <tr>

                        <td colspan="6">

                            No participants
                            registered yet.

                        </td>

                    </tr>

                `;

                return;

            }



            // ==================================
            // CREATE PARTICIPANT ROWS
            // ==================================

            snapshot.forEach(
                function(userDoc) {


                    const u =
                        userDoc.data();


                    const approved =
                        u.emailApproved === true;


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <!-- NAME -->

                        <td>

                            ${escapeHTML(
                                u.fullName || ""
                            )}

                        </td>


                        <!-- COLLEGE -->

                        <td>

                            ${escapeHTML(
                                u.college || ""
                            )}

                        </td>


                        <!-- DEPARTMENT -->

                        <td>

                            ${escapeHTML(
                                u.department || ""
                            )}

                        </td>


                        <!-- EMAIL -->

                        <td>

                            ${escapeHTML(
                                u.email || ""
                            )}

                        </td>


                        <!-- STATUS -->

                        <td>

                            ${
                                approved
                                ? "Approved"
                                : "Pending"
                            }

                        </td>


                        <!-- ACTION BUTTONS -->

                        <td class="action-buttons">


                            <!-- APPROVE BUTTON -->

                            <button

                                class="${
                                    approved
                                    ? "btn btn-secondary"
                                    : "btn btn-primary"
                                } approve-btn"

                                data-id="${userDoc.id}"

                                ${
                                    approved
                                    ? "disabled"
                                    : ""
                                }

                            >

                                ${
                                    approved
                                    ? "Approved"
                                    : "Approve"
                                }

                            </button>


                            <!-- DELETE BUTTON -->

                            <button

                                class="btn btn-danger delete-participant-btn"

                                data-id="${userDoc.id}"

                                style="margin-left:8px;"

                            >

                                Delete

                            </button>


                        </td>

                    `;


                    table.appendChild(
                        row
                    );

                }
            );



            // ==================================
            // APPROVE BUTTONS
            // ==================================

            document
                .querySelectorAll(
                    ".approve-btn"
                )
                .forEach(
                    function(button) {


                        button.addEventListener(
                            "click",
                            async function() {


                                const id =
                                    button.getAttribute(
                                        "data-id"
                                    );


                                button.disabled =
                                    true;


                                button.innerText =
                                    "Approving...";


                                try {


                                    await updateDoc(

                                        doc(
                                            db,
                                            "users",
                                            id
                                        ),

                                        {
                                            emailApproved:
                                                true
                                        }

                                    );


                                    alert(
                                        "Participant approved successfully."
                                    );


                                    await loadUsers();


                                }

                                catch(error) {


                                    console.error(
                                        "Approve error:",
                                        error
                                    );


                                    alert(
                                        "Failed to approve participant."
                                    );


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Approve";

                                }

                            }
                        );

                    }
                );



            // ==================================
            // DELETE PARTICIPANT BUTTONS
            // ==================================

            document
                .querySelectorAll(
                    ".delete-participant-btn"
                )
                .forEach(
                    function(button) {


                        button.addEventListener(
                            "click",
                            async function() {


                                const id =
                                    button.getAttribute(
                                        "data-id"
                                    );


                                const participantRow =
                                    button.closest("tr");


                                const participantName =
                                    participantRow
                                        ?.children[0]
                                        ?.innerText ||
                                    "this participant";


                                // Confirmation

                                const ok =
                                    confirm(
                                        "Are you sure you want to delete " +
                                        participantName +
                                        "?"
                                    );


                                if (!ok) {

                                    return;

                                }


                                button.disabled =
                                    true;


                                button.innerText =
                                    "Deleting...";


                                try {


                                    // Delete participant
                                    // from Firestore users collection

                                    await deleteDoc(

                                        doc(
                                            db,
                                            "users",
                                            id
                                        )

                                    );


                                    alert(
                                        "Participant deleted successfully."
                                    );


                                    // Reload participant list

                                    await loadUsers();


                                }

                                catch(error) {


                                    console.error(
                                        "Delete participant error:",
                                        error
                                    );


                                    alert(
                                        "Failed to delete participant."
                                    );


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Delete";

                                }

                            }
                        );

                    }
                );

        }


        catch(error) {


            console.error(
                "Users error:",
                error
            );


            table.innerHTML = `

                <tr>

                    <td colspan="6">

                        Failed to load participants.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </td>

                </tr>

            `;

        }

    }



    // ==========================================
    // LOAD SUBMISSIONS
    // ==========================================

    async function loadSubmissions() {


        submissions.innerHTML = `

            <p>
                Loading submitted designs...
            </p>

        `;


        try {


            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "submissions"
                    )
                );


            submissions.innerHTML = "";


            // No submissions

            if (
                snapshot.empty
            ) {

                submissions.innerHTML = `

                    <p>
                        No designs submitted yet.
                    </p>

                `;

                return;

            }



            snapshot.forEach(
                function(designDoc) {


                    const d =
                        designDoc.data();


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "design-card";


                    card.style.cssText = `

                        margin-top:20px;

                        background:#334155;

                        padding:20px;

                        border-radius:12px;

                    `;


                    card.innerHTML = `

                        <h3>

                            ${escapeHTML(
                                d.participant ||
                                "Participant"
                            )}

                        </h3>


                        <p>

                            <b>Email:</b>

                            ${escapeHTML(
                                d.email || ""
                            )}

                        </p>


                        <p>

                            <b>Prompt:</b>

                            ${escapeHTML(
                                d.prompt || ""
                            )}

                        </p>


                        <p>

                            <b>Submitted:</b>

                            ${escapeHTML(
                                d.submittedAt || ""
                            )}

                        </p>


                        <img

                            src="${escapeAttribute(
                                d.image || ""
                            )}"

                            style="
                                width:300px;
                                max-width:100%;
                                border-radius:10px;
                                display:block;
                                margin-top:15px;
                            "

                            alt="Submitted Design"

                        >


                        <br>


                        <a

                            href="${escapeAttribute(
                                d.image || ""
                            )}"

                            target="_blank"

                            rel="noopener noreferrer"

                        >

                            <button
                                class="btn btn-secondary"
                            >
                                View Design
                            </button>

                        </a>


                        <button

                            class="btn btn-danger delete-btn"

                            data-id="${designDoc.id}"

                            style="margin-left:10px;"

                        >

                            Delete

                        </button>

                    `;


                    submissions.appendChild(
                        card
                    );

                }
            );



            // ==================================
            // DELETE SUBMISSION BUTTONS
            // ==================================

            document
                .querySelectorAll(
                    ".delete-btn"
                )
                .forEach(
                    function(button) {


                        button.addEventListener(
                            "click",
                            async function() {


                                const id =
                                    button.getAttribute(
                                        "data-id"
                                    );


                                const ok =
                                    confirm(
                                        "Delete this submission?"
                                    );


                                if (!ok) {

                                    return;

                                }


                                button.disabled =
                                    true;


                                button.innerText =
                                    "Deleting...";


                                try {


                                    await deleteDoc(

                                        doc(
                                            db,
                                            "submissions",
                                            id
                                        )

                                    );


                                    await loadSubmissions();


                                }

                                catch(error) {


                                    console.error(
                                        error
                                    );


                                    alert(
                                        "Failed to delete submission."
                                    );


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Delete";

                                }

                            }
                        );

                    }
                );

        }


        catch(error) {


            console.error(
                "Submissions error:",
                error
            );


            submissions.innerHTML = `

                <p>

                    Failed to load submissions.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </p>

            `;

        }

    }



    // ==========================================
    // REFRESH DATA
    // ==========================================

    async function refreshData() {


        refreshBtn.disabled =
            true;


        refreshBtn.innerText =
            "Refreshing...";


        try {


            await Promise.all([

                loadUsers(),

                loadSubmissions()

            ]);

        }


        finally {


            refreshBtn.disabled =
                false;


            refreshBtn.innerText =
                "Refresh Data";

        }

    }



    // ==========================================
    // REFRESH BUTTON
    ==========================================

    refreshBtn.addEventListener(
        "click",
        refreshData
    );



    // ==========================================
    // LOGOUT
    // ==========================================

    logoutBtn.addEventListener(
        "click",
        async function() {


            const ok =
                confirm(
                    "Logout from admin dashboard?"
                );


            if (!ok) {

                return;

            }


            try {


                await signOut(auth);


                localStorage.removeItem(
                    "adminLoggedIn"
                );


                localStorage.removeItem(
                    "adminEmail"
                );


                window.location.href =
                    "admin-login.html";

            }


            catch(error) {


                console.error(
                    "Logout error:",
                    error
                );


                alert(
                    "Logout failed."
                );

            }

        }
    );



    // ==========================================
    // SECURITY HELPERS
    // ==========================================

    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }



    function escapeAttribute(value) {

        return String(value)

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


</script>


</body>

</html>
