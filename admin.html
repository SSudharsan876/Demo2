<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prompt Forge | Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ==========================================
           SUBMISSION CARD
        ========================================== */

        .design-card {
            margin-top: 20px;
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.20);
        }

        .design-card h3 {
            margin-bottom: 15px;
        }


        /* ==========================================
           SUBMISSION INFORMATION
        ========================================== */

        .submission-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .info-box {
            background: #0f172a;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            overflow-wrap: anywhere;
        }

        .info-box span {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .info-box strong {
            color: white;
            font-size: 15px;
        }


        /* ==========================================
           TIME
        ========================================== */

        .time-used {
            color: #facc15 !important;
            font-size: 17px !important;
        }


        /* ==========================================
           SUBMITTED DATE
        ========================================== */

        .submitted-date {
            color: #93c5fd !important;
        }


        /* ==========================================
           DESIGN IMAGE
        ========================================== */

        .design-image {
            width: 300px;
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 12px;
            display: block;
            margin-top: 20px;
            background: #020617;
            border: 1px solid #334155;
        }


        /* ==========================================
           ACTION BUTTONS
        ========================================== */

        .submission-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .submission-actions .btn {
            margin-top: 0;
        }


        /* ==========================================
           EMPTY / ERROR MESSAGE
        ========================================== */

        .empty-message {
            margin-top: 20px;
            padding: 20px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #cbd5e1;
        }

        .error-message {
            color: #fca5a5;
        }


        /* ==========================================
           STATUS
        ========================================== */

        .status-approved {
            color: #4ade80 !important;
        }

        .status-pending {
            color: #facc15 !important;
        }


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 700px) {

            .submission-info {
                grid-template-columns: 1fr;
            }

            .design-card {
                padding: 18px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- ==========================================
         HEADER
    =========================================== -->

    <div class="workspace-header">

        <div>

            <span class="badge">
                Admin Panel
            </span>

            <h1>
                Prompt Forge Dashboard
            </h1>

            <p>
                Approve participants and review
                submitted AI designs.
            </p>

            <p
                id="adminEmail"
                style="font-size:14px;"
            ></p>

        </div>


        <div style="display:flex; gap:10px; flex-wrap:wrap;">

            <button
                id="refreshBtn"
                class="btn btn-primary"
                type="button"
            >
                Refresh Data
            </button>

            <button
                id="logoutBtn"
                class="btn btn-danger"
                type="button"
            >
                Logout
            </button>

        </div>

    </div>


    <hr>


    <!-- ==========================================
         PARTICIPANT APPROVAL
    =========================================== -->

    <h2>
        Participant Approval
    </h2>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>Name</th>

                    <th>College</th>

                    <th>Department</th>

                    <th>Email</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="table">

                <tr>

                    <td colspan="6">
                        Loading participants...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <hr>


    <!-- ==========================================
         SUBMITTED DESIGNS
    =========================================== -->

    <h2>
        Submitted Designs
    </h2>


    <div id="submissions">

        <p>
            Loading submissions...
        </p>

    </div>


</div>


<!-- ==========================================
     FIREBASE
=========================================== -->

<script type="module">


    // ==========================================
    // IMPORT FIREBASE
    // ==========================================

    import {
        auth,
        db
    } from "./firebase.js";


    import {
        onAuthStateChanged,
        signOut
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        collection,
        getDocs,
        doc,
        updateDoc,
        deleteDoc
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ==========================================
    // ADMIN EMAIL
    // ==========================================

    const ADMIN_EMAIL =
        "promptforgeadmin@gmail.com";


    // ==========================================
    // PAGE ELEMENTS
    // ==========================================

    const table =
        document.getElementById("table");


    const submissions =
        document.getElementById("submissions");


    const refreshBtn =
        document.getElementById("refreshBtn");


    const logoutBtn =
        document.getElementById("logoutBtn");


    const adminEmail =
        document.getElementById("adminEmail");


    // ==========================================
    // AUTHENTICATION CHECK
    // ==========================================

    onAuthStateChanged(
        auth,
        async function(user) {

            // No logged-in user

            if (!user) {

                window.location.href =
                    "admin-login.html";

                return;

            }


            // Check admin email

            if (
                user.email !== ADMIN_EMAIL
            ) {

                alert(
                    "You are not authorized to access the admin dashboard."
                );


                try {

                    await signOut(auth);

                }

                catch(error) {

                    console.error(
                        "Sign out error:",
                        error
                    );

                }


                window.location.href =
                    "admin-login.html";

                return;

            }


            // Display admin email

            adminEmail.innerText =
                "Logged in as: " +
                user.email;


            // Load dashboard

            await refreshData();

        }
    );


    // ==========================================
    // LOAD USERS
    // ==========================================

    async function loadUsers() {

        table.innerHTML = `

            <tr>

                <td colspan="6">
                    Loading participants...
                </td>

            </tr>

        `;


        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "users"
                    )
                );


            table.innerHTML = "";


            // No users

            if (
                snapshot.empty
            ) {

                table.innerHTML = `

                    <tr>

                        <td colspan="6">

                            No participants
                            registered yet.

                        </td>

                    </tr>

                `;

                return;

            }


            // ==================================
            // DISPLAY USERS
            // ==================================

            snapshot.forEach(
                function(userDoc) {

                    const u =
                        userDoc.data();


                    const approved =
                        u.emailApproved === true;


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            ${escapeHTML(
                                u.fullName || "-"
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                u.college || "-"
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                u.department || "-"
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                u.email || "-"
                            )}
                        </td>


                        <td>

                            <span
                                class="${
                                    approved
                                    ? "status-approved"
                                    : "status-pending"
                                }"
                            >

                                ${
                                    approved
                                    ? "Approved"
                                    : "Pending"
                                }

                            </span>

                        </td>


                        <td>

                            ${
                                approved

                                ?

                                `
                                <button
                                    class="btn btn-secondary"
                                    disabled
                                    type="button"
                                >
                                    Approved
                                </button>
                                `

                                :

                                `
                                <button
                                    class="btn btn-primary approve-btn"
                                    data-id="${escapeAttribute(
                                        userDoc.id
                                    )}"
                                    type="button"
                                >
                                    Approve
                                </button>
                                `
                            }

                        </td>

                    `;


                    table.appendChild(
                        row
                    );

                }
            );


            // ==================================
            // APPROVE BUTTONS
            // ==================================

            document
                .querySelectorAll(
                    ".approve-btn"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            async function() {

                                const id =
                                    button.getAttribute(
                                        "data-id"
                                    );


                                if (!id) {

                                    return;

                                }


                                button.disabled =
                                    true;


                                button.innerText =
                                    "Approving...";


                                try {

                                    await updateDoc(

                                        doc(
                                            db,
                                            "users",
                                            id
                                        ),

                                        {
                                            emailApproved:
                                                true
                                        }

                                    );


                                    await loadUsers();

                                }

                                catch(error) {

                                    console.error(
                                        "Approval error:",
                                        error
                                    );


                                    alert(
                                        "Failed to approve participant."
                                    );


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Approve";

                                }

                            }
                        );

                    }
                );

        }


        catch(error) {

            console.error(
                "Users error:",
                error
            );


            table.innerHTML = `

                <tr>

                    <td colspan="6">

                        Failed to load participants.

                        <br><br>

                        ${escapeHTML(
                            error.message ||
                            "Unknown error"
                        )}

                    </td>

                </tr>

            `;

        }

    }


    // ==========================================
    // LOAD SUBMISSIONS
    // ==========================================

    async function loadSubmissions() {

        submissions.innerHTML = `

            <p>
                Loading submitted designs...
            </p>

        `;


        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "submissions"
                    )
                );


            submissions.innerHTML = "";


            // ==================================
            // NO SUBMISSIONS
            // ==================================

            if (
                snapshot.empty
            ) {

                submissions.innerHTML = `

                    <div class="empty-message">

                        No designs submitted yet.

                    </div>

                `;

                return;

            }


            // ==================================
            // DISPLAY SUBMISSIONS
            // ==================================

            snapshot.forEach(
                function(designDoc) {

                    const d =
                        designDoc.data();


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "design-card";


                    // ==================================
                    // PARTICIPANT NAME
                    // ==================================

                    const participant =
                        d.participant ||
                        d.fullName ||
                        d.name ||
                        "Participant";


                    // ==================================
                    // EMAIL
                    // ==================================

                    const email =
                        d.email ||
                        "-";


                    // ==================================
                    // PROMPT
                    // ==================================

                    const prompt =
                        d.prompt ||
                        "-";


                    // ==================================
                    // STATUS
                    // ==================================

                    const status =
                        d.status ||
                        "Submitted";


                    // ==================================
                    // TIME USED
                    // ==================================

                    let timeUsed =
                        d.timeUsed ||
                        "Not recorded";


                    // Old submission:
                    // timeUsedSeconds

                    if (
                        !d.timeUsed &&
                        typeof d.timeUsedSeconds === "number"
                    ) {

                        const totalSeconds =
                            Math.max(
                                0,
                                Math.floor(
                                    d.timeUsedSeconds
                                )
                            );


                        const minutes =
                            Math.floor(
                                totalSeconds / 60
                            );


                        const seconds =
                            totalSeconds % 60;


                        timeUsed =
                            `${minutes} min ${String(
                                seconds
                            ).padStart(2, "0")} sec`;

                    }


                    // ==================================
                    // IMAGE
                    // ==================================

                    const image =
                        d.image ||
                        d.imageUrl ||
                        d.designImage ||
                        "";


                    // ==================================
                    // SUBMITTED DATE
                    // ==================================

                    const submittedDate =
                        formatDate(
                            d.submittedAt ||
                            d.createdAt ||
                            d.timestamp ||
                            d.submittedDate
                        );


                    // ==================================
                    // CARD HTML
                    // ==================================

                    card.innerHTML = `

                        <h3>

                            ${escapeHTML(
                                participant
                            )}

                        </h3>


                        <div class="submission-info">


                            <!-- EMAIL -->

                            <div class="info-box">

                                <span>
                                    Email
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        email
                                    )}
                                </strong>

                            </div>


                            <!-- TIME USED -->

                            <div class="info-box">

                                <span>
                                    Time Used
                                </span>

                                <strong
                                    class="time-used"
                                >

                                    ⏱️
                                    ${escapeHTML(
                                        timeUsed
                                    )}

                                </strong>

                            </div>


                            <!-- SUBMITTED -->

                            <div class="info-box">

                                <span>
                                    Submitted
                                </span>

                                <strong
                                    class="submitted-date"
                                >

                                    📅
                                    ${escapeHTML(
                                        submittedDate
                                    )}

                                </strong>

                            </div>


                            <!-- STATUS -->

                            <div class="info-box">

                                <span>
                                    Status
                                </span>

                                <strong>

                                    ${escapeHTML(
                                        status
                                    )}

                                </strong>

                            </div>


                        </div>


                        <!-- ==================================
                             DESIGN PROMPT
                        =================================== -->

                        <div
                            style="margin-top:20px;"
                        >

                            <strong>
                                Design Prompt
                            </strong>


                            <p
                                style="
                                    margin-top:8px;
                                    color:#cbd5e1;
                                    line-height:1.6;
                                    white-space:pre-wrap;
                                "
                            >

                                ${escapeHTML(
                                    prompt
                                )}

                            </p>

                        </div>


                        <!-- ==================================
                             DESIGN IMAGE
                        =================================== -->

                        ${
                            image

                            ?

                            `

                            <img

                                src="${escapeAttribute(
                                    image
                                )}"

                                class="design-image"

                                alt="Submitted Design"

                                loading="lazy"

                                onerror="
                                    this.style.display='none';
                                    this.nextElementSibling.style.display='block';
                                "

                            >

                            <p
                                style="
                                    display:none;
                                    color:#fca5a5;
                                    margin-top:15px;
                                "
                            >
                                Unable to load submitted design.
                            </p>

                            `

                            :

                            `

                            <p
                                style="
                                    margin-top:20px;
                                    color:#94a3b8;
                                "
                            >
                                No design image available.
                            </p>

                            `

                        }


                        <!-- ==================================
                             ACTIONS
                        =================================== -->

                        <div class="submission-actions">


                            ${
                                image

                                ?

                                `

                                <a
                                    href="${escapeAttribute(
                                        image
                                    )}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >

                                    <button
                                        class="btn btn-secondary"
                                        type="button"
                                    >
                                        View Design
                                    </button>

                                </a>

                                `

                                :

                                ""

                            }


                            <button

                                class="btn btn-danger delete-btn"

                                data-id="${escapeAttribute(
                                    designDoc.id
                                )}"

                                type="button"

                            >

                                Delete

                            </button>


                        </div>

                    `;


                    submissions.appendChild(
                        card
                    );

                }
            );


            // ==================================
            // DELETE BUTTONS
            // ==================================

            document
                .querySelectorAll(
                    ".delete-btn"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            async function() {

                                const id =
                                    button.getAttribute(
                                        "data-id"
                                    );


                                if (!id) {

                                    return;

                                }


                                const ok =
                                    confirm(
                                        "Delete this submission?"
                                    );


                                if (!ok) {

                                    return;

                                }


                                button.disabled =
                                    true;


                                button.innerText =
                                    "Deleting...";


                                try {

                                    await deleteDoc(

                                        doc(
                                            db,
                                            "submissions",
                                            id
                                        )

                                    );


                                    await loadSubmissions();

                                }

                                catch(error) {

                                    console.error(
                                        "Delete error:",
                                        error
                                    );


                                    alert(
                                        "Failed to delete submission."
                                    );


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Delete";

                                }

                            }
                        );

                    }
                );

        }


        catch(error) {

            console.error(
                "Submissions error:",
                error
            );


            submissions.innerHTML = `

                <div
                    class="empty-message error-message"
                >

                    Failed to load submissions.

                    <br><br>

                    ${escapeHTML(
                        error.message ||
                        "Unknown error"
                    )}

                </div>

            `;

        }

    }


    // ==========================================
    // FORMAT DATE
    //
    // Supports:
    // 1. Firestore Timestamp
    // 2. Firestore Timestamp-like object
    // 3. JavaScript Date
    // 4. Unix milliseconds
    // 5. Unix seconds
    // 6. Date strings
    // ==========================================

    function formatDate(value) {

        // Empty value

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "-";

        }


        try {

            let date = null;


            // ======================================
            // FIRESTORE TIMESTAMP
            // ======================================

            if (
                value &&
                typeof value.toDate === "function"
            ) {

                date =
                    value.toDate();

            }


            // ======================================
            // FIRESTORE TIMESTAMP-LIKE OBJECT
            //
            // Example:
            // {
            //    seconds: 1234567890,
            //    nanoseconds: 123456789
            // }
            // ======================================

            else if (
                value &&
                typeof value.seconds === "number"
            ) {

                date =
                    new Date(
                        value.seconds * 1000
                    );

            }


            // ======================================
            // JAVASCRIPT DATE
            // ======================================

            else if (
                value instanceof Date
            ) {

                date =
                    value;

            }


            // ======================================
            // NUMBER
            // ======================================

            else if (
                typeof value === "number"
            ) {

                // Seconds timestamp
                // Example: 1750000000

                if (
                    value < 10000000000
                ) {

                    date =
                        new Date(
                            value * 1000
                        );

                }

                // Milliseconds timestamp

                else {

                    date =
                        new Date(
                            value
                        );

                }

            }


            // ======================================
            // STRING
            // ======================================

            else if (
                typeof value === "string"
            ) {

                const trimmed =
                    value.trim();


                if (!trimmed) {

                    return "-";

                }


                date =
                    new Date(
                        trimmed
                    );

            }


            // ======================================
            // UNKNOWN TYPE
            // ======================================

            else {

                return "-";

            }


            // ======================================
            // INVALID DATE CHECK
            // ======================================

            if (
                !date ||
                isNaN(
                    date.getTime()
                )
            ) {

                return "-";

            }


            // ======================================
            // FORMAT DATE
            // ======================================

            return date.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                }
            );

        }

        catch(error) {

            console.error(
                "Date formatting error:",
                error,
                value
            );


            return "-";

        }

    }


    // ==========================================
    // REFRESH DATA
    // ==========================================

    async function refreshData() {

        refreshBtn.disabled =
            true;


        refreshBtn.innerText =
            "Refreshing...";


        try {

            await Promise.all([

                loadUsers(),

                loadSubmissions()

            ]);

        }

        catch(error) {

            console.error(
                "Refresh error:",
                error
            );

        }

        finally {

            refreshBtn.disabled =
                false;


            refreshBtn.innerText =
                "Refresh Data";

        }

    }


    // ==========================================
    // REFRESH BUTTON
    // ==========================================

    refreshBtn.addEventListener(
        "click",
        refreshData
    );


    // ==========================================
    // LOGOUT
    // ==========================================

    logoutBtn.addEventListener(
        "click",
        async function() {

            const ok =
                confirm(
                    "Logout from admin dashboard?"
                );


            if (!ok) {

                return;

            }


            try {

                await signOut(
                    auth
                );


                localStorage.removeItem(
                    "adminLoggedIn"
                );


                localStorage.removeItem(
                    "adminEmail"
                );


                window.location.href =
                    "admin-login.html";

            }


            catch(error) {

                console.error(
                    "Logout error:",
                    error
                );


                alert(
                    "Logout failed."
                );

            }

        }
    );


    // ==========================================
    // SECURITY HELPER
    // ==========================================

    function escapeHTML(value) {

        return String(
            value ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }


    // ==========================================
    // ATTRIBUTE SECURITY HELPER
    // ==========================================

    function escapeAttribute(value) {

        return String(
            value ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

    }


</script>

</body>

</html>
