<!DOCTYPE html>

<html>
<head>
    <title>Prompt Forge - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

```
<h1>⚡ Prompt Forge</h1>
<h2>Admin Dashboard</h2>

<h3>Participant Approval</h3>

<table border="1" width="100%">
    <thead>
        <tr>
            <th>Name</th>
            <th>College</th>
            <th>Department</th>
            <th>Email</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="table"></tbody>

</table>

<hr style="margin:40px 0;">

<h3>Submitted Designs</h3>

<div id="submissions"></div>
```

</div>

<script type="module">
import { db } from "./firebase.js";
import {
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function loadUsers() {

  const tbody = document.getElementById("table");

  tbody.innerHTML = "";

  const snapshot = await getDocs(collection(db, "users"));

  snapshot.forEach((userDoc) => {

    const u = userDoc.data();

    tbody.innerHTML += `
      <tr>
        <td>${u.fullName}</td>
        <td>${u.email}</td>
        <td>${u.emailApproved ? "Approved" : "Pending"}</td>
        <td>
          ${
            u.emailApproved
            ? "Approved"
            : `<button onclick="approveUser('${userDoc.id}')">Approve</button>`
          }
        </td>
      </tr>
    `;

  });

}

window.approveUser = async function(id){

  await updateDoc(
    doc(db, "users", id),
    { emailApproved: true }
  );

  loadUsers();

};

loadUsers();
</script>

</body>
</html>
