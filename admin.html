<!DOCTYPE html>

<html>
<head>
    <title>Prompt Forge - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

```
<h1>⚡ Prompt Forge</h1>
<h2>Admin Dashboard</h2>

<button id="refreshBtn">🔄 Refresh Data</button>

<hr style="margin:20px 0;">

<h3>Participant Approval</h3>

<table border="1" width="100%">
    <thead>
        <tr>
            <th>Name</th>
            <th>College</th>
            <th>Department</th>
            <th>Email</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="table"></tbody>
</table>

<hr style="margin:40px 0;">

<h3>Submitted Designs</h3>

<div id="submissions"></div>
```

</div>

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ---------------- Load Users ----------------

async function loadUsers(){

    const tbody = document.getElementById("table");

    tbody.innerHTML = "";

    try{

        const snapshot = await getDocs(collection(db, "users"));

        snapshot.forEach((userDoc)=>{

            const u = userDoc.data();

            tbody.innerHTML += `
                <tr>
                    <td>${u.fullName || ""}</td>
                    <td>${u.college || ""}</td>
                    <td>${u.department || ""}</td>
                    <td>${u.email || ""}</td>
                    <td>${u.emailApproved ? "Approved" : "Pending"}</td>
                    <td>
                        ${
                            u.emailApproved
                            ? "Approved"
                            : `<button class="approve-btn" data-id="${userDoc.id}">Approve</button>`
                        }
                    </td>
                </tr>
            `;

        });

        document.querySelectorAll(".approve-btn").forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = btn.getAttribute("data-id");
                await approveUser(id);
            });
        });

    }

    catch(error){

        console.error(error);

        alert("Failed to load users");

    }

}


// ---------------- Approve User ----------------

async function approveUser(id){

    try{

        await updateDoc(doc(db, "users", id),{

            emailApproved: true

        });

        alert("Participant approved successfully!");

        await loadUsers();

    }

    catch(error){

        console.error(error);

        alert("Approval failed");

    }

}


// ---------------- Load Submissions ----------------

async function loadSubmissions(){

    const box = document.getElementById("submissions");

    box.innerHTML = "";

    try{

        const snapshot = await getDocs(collection(db, "submissions"));

        if(snapshot.empty){

            box.innerHTML = "<p>No designs submitted yet.</p>";

            return;

        }

        snapshot.forEach((designDoc)=>{

            const d = designDoc.data();

            box.innerHTML += `
                <div class="design-card" style="margin-top:20px; background:#334155; padding:20px; border-radius:12px;">

                    <h3>${d.participant || "Participant"}</h3>

                    <p><b>Email:</b> ${d.email || ""}</p>

                    <p><b>Prompt:</b> ${d.prompt || ""}</p>

                    <p><b>Submitted:</b> ${d.submittedAt || ""}</p>

                    <img src="${d.image}" style="max-width:300px; border-radius:10px;" alt="Submitted Design">

                    <br><br>

                    <a href="${d.image}" target="_blank">
                        <button>View Design</button>
                    </a>

                </div>
            `;

        });

    }

    catch(error){

        console.error(error);

        alert("Failed to load submissions");

    }

}


// ---------------- Refresh Button ----------------

document.getElementById("refreshBtn").addEventListener("click", async () => {

    await loadUsers();

    await loadSubmissions();

});


// ---------------- Initial Load (ONLY ONCE) ----------------

loadUsers();

loadSubmissions();

</script>

</body>
</html>
