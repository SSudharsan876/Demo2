<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Forge | Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="workspace-header">

```
<div>

  <span class="badge">Admin Panel</span>

  <h1>Prompt Forge Dashboard</h1>

  <p>Approve participants and review submitted AI designs.</p>

</div>

<button id="refreshBtn" class="btn btn-primary">Refresh Data</button>
```

  </div>

  <div class="grid">

```
<div class="stat">
  <h4>Total Participants</h4>
  <div class="value" id="totalParticipants">0</div>
</div>

<div class="stat">
  <h4>Approved</h4>
  <div class="value" id="approvedCount">0</div>
</div>

<div class="stat">
  <h4>Submissions</h4>
  <div class="value" id="submissionCount">0</div>
</div>
```

  </div>

  <hr>

  <h2>Participant Approval</h2>

  <div id="participants" class="grid"></div>

  <hr>

  <h2>Submitted Designs</h2>

  <div id="submissions" class="grid"></div>

</div>

<script type="module">

import { db } from './firebase.js';

import {
  collection,
  getDocs,
  doc,
  updateDoc
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

async function loadUsers(){

  const container = document.getElementById('participants');

  container.innerHTML = '';

  const snapshot = await getDocs(collection(db,'users'));

  let total = 0;
  let approved = 0;

  snapshot.forEach((userDoc)=>{

    total++;

    const u = userDoc.data();

    if(u.emailApproved) approved++;

    const card = document.createElement('div');

    card.className = 'card';

    card.innerHTML = `
      <h3>${u.fullName || 'Participant'}</h3>
      <p><strong>College:</strong> ${u.college || ''}</p>
      <p><strong>Department:</strong> ${u.department || ''}</p>
      <p><strong>Email:</strong> ${u.email || ''}</p>
      <p><strong>Status:</strong> ${u.emailApproved ? 'Approved' : 'Pending'}</p>
      ${
        u.emailApproved
        ? '<button class="btn btn-success" disabled>Approved</button>'
        : `<button class="btn btn-primary approve-btn" data-id="${userDoc.id}">Approve</button>`
      }
    `;

    container.appendChild(card);

  });

  document.getElementById('totalParticipants').innerText = total;
  document.getElementById('approvedCount').innerText = approved;

  document.querySelectorAll('.approve-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-id');
      await updateDoc(doc(db,'users',id),{
        emailApproved:true
      });
      await refreshData();
    });
  });

}

async function loadSubmissions(){

  const container = document.getElementById('submissions');

  container.innerHTML = '';

  const snapshot = await getDocs(collection(db,'submissions'));

  let count = 0;

  snapshot.forEach((designDoc)=>{

    count++;

    const d = designDoc.data();

    const card = document.createElement('div');

    card.className = 'design-card';

    card.innerHTML = `
      <h3>${d.participant || 'Participant'}</h3>
      <p><strong>Email:</strong> ${d.email || ''}</p>
      <p><strong>Prompt:</strong> ${d.prompt || ''}</p>
      <p><strong>Submitted:</strong> ${d.submittedAt || ''}</p>
      <img src="${d.image}" alt="Submitted Design">
      <br><br>
      <a href="${d.image}" target="_blank">
        <button class="btn btn-secondary">View Full Design</button>
      </a>
    `;

    container.appendChild(card);

  });

  document.getElementById('submissionCount').innerText = count;

}

async function refreshData(){

  await loadUsers();

  await loadSubmissions();

}

document.getElementById('refreshBtn').addEventListener('click', refreshData);

refreshData();

</script>

</body>
</html>
