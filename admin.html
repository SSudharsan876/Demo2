<style>

    /* ================================
       SUBMISSION CARD
    ================================= */

    .design-card {
        margin-top: 20px;
        background: #1e293b;
        padding: 24px;
        border-radius: 16px;
        border: 1px solid #334155;
        box-shadow: 0 10px 30px rgba(0,0,0,0.20);
    }

    .design-card h3 {
        margin-bottom: 15px;
    }

    .submission-info {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 15px;
    }

    .info-box {
        background: #0f172a;
        padding: 12px 15px;
        border-radius: 10px;
        border: 1px solid #334155;
    }

    .info-box span {
        display: block;
        font-size: 11px;
        color: #94a3b8;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .info-box strong {
        color: white;
        font-size: 15px;
    }

    .time-used {
        color: #facc15 !important;
        font-size: 17px !important;
    }

    .design-image {
        width: 300px;
        max-width: 100%;
        max-height: 400px;
        object-fit: contain;
        border-radius: 12px;
        display: block;
        margin-top: 20px;
        background: #020617;
    }

    .submission-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 15px;
    }

    .submission-actions .btn {
        margin-top: 0;
    }

    @media (max-width: 700px) {

        .submission-info {
            grid-template-columns: 1fr;
        }

    }

</style>

</div>

<!-- ==========================================
     FIREBASE
=========================================== -->

<script type="module">


    // ==========================================
    // IMPORT FIREBASE
    // ==========================================

    import {
        auth,
        db
    } from "./firebase.js";


    import {
        onAuthStateChanged,
        signOut
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        collection,
        getDocs,
        doc,
        updateDoc,
        deleteDoc
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ==========================================
    // ADMIN EMAIL
    // ==========================================

    const ADMIN_EMAIL =
        "promptforgeadmin@gmail.com";


    // ==========================================
    // PAGE ELEMENTS
    // ==========================================

    const table =
        document.getElementById("table");


    const submissions =
        document.getElementById("submissions");


    const refreshBtn =
        document.getElementById("refreshBtn");


    const logoutBtn =
        document.getElementById("logoutBtn");


    const adminEmail =
        document.getElementById("adminEmail");


    // ==========================================
    // AUTHENTICATION CHECK
    // ==========================================

    onAuthStateChanged(
        auth,
        async function(user) {

            // No Firebase user

            if (!user) {

                window.location.href =
                    "admin-login.html";

                return;

            }


            // Check admin email

            if (
                user.email !==
                ADMIN_EMAIL
            ) {

                alert(
                    "You are not authorized to access the admin dashboard."
                );


                await signOut(auth);


                window.location.href =
                    "admin-login.html";

                return;

            }


            // Show admin email

            adminEmail.innerText =
                "Logged in as: " +
                user.email;


            // Load dashboard

            await refreshData();

        }
    );


    // ==========================================
    // LOAD USERS
    // ==========================================

    async function loadUsers() {

        table.innerHTML = `

            <tr>

                <td colspan="6">
                    Loading participants...
                </td>

            </tr>

        `;


        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "users"
                    )
                );


            table.innerHTML = "";


            if (
                snapshot.empty
            ) {

                table.innerHTML = `

                    <tr>

                        <td colspan="6">

                            No participants
                            registered yet.

                        </td>

                    </tr>

                `;

                return;

            }


            snapshot.forEach(
                function(userDoc) {

                    const u =
                        userDoc.data();


                    const approved =
                        u.emailApproved === true;


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            ${escapeHTML(
                                u.fullName || ""
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                u.college || ""
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                u.department || ""
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                u.email || ""
                            )}
                        </td>


                        <td>

                            ${
                                approved
                                ? "Approved"
                                : "Pending"
                            }

                        </td>


                        <td>

                            ${
                                approved

                                ?

                                `
                                <button
                                    class="btn btn-secondary"
                                    disabled
                                >
                                    Approved
                                </button>
                                `

                                :

                                `
                                <button
                                    class="btn btn-primary approve-btn"
                                    data-id="${userDoc.id}"
                                >
                                    Approve
                                </button>
                                `
                            }

                        </td>

                    `;


                    table.appendChild(row);

                }
            );


            // ==================================
            // APPROVE BUTTONS
            // ==================================

            document
                .querySelectorAll(
                    ".approve-btn"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            async function() {

                                const id =
                                    button.getAttribute(
                                        "data-id"
                                    );


                                button.disabled =
                                    true;


                                button.innerText =
                                    "Approving...";


                                try {

                                    await updateDoc(

                                        doc(
                                            db,
                                            "users",
                                            id
                                        ),

                                        {
                                            emailApproved:
                                                true
                                        }

                                    );


                                    await loadUsers();

                                }

                                catch(error) {

                                    console.error(
                                        error
                                    );


                                    alert(
                                        "Failed to approve participant."
                                    );


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Approve";

                                }

                            }
                        );

                    }
                );

        }


        catch(error) {

            console.error(
                "Users error:",
                error
            );


            table.innerHTML = `

                <tr>

                    <td colspan="6">

                        Failed to load participants.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </td>

                </tr>

            `;

        }

    }


    // ==========================================
    // LOAD SUBMISSIONS
    // ==========================================

    async function loadSubmissions() {

        submissions.innerHTML = `

            <p>
                Loading submitted designs...
            </p>

        `;


        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "submissions"
                    )
                );


            submissions.innerHTML = "";


            // ==================================
            // NO SUBMISSIONS
            // ==================================

            if (
                snapshot.empty
            ) {

                submissions.innerHTML = `

                    <p>
                        No designs submitted yet.
                    </p>

                `;

                return;

            }


            // ==================================
            // DISPLAY SUBMISSIONS
            // ==================================

            snapshot.forEach(
                function(designDoc) {

                    const d =
                        designDoc.data();


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "design-card";


                    // ==================================
                    // TIME USED
                    // ==================================

                    let timeUsed =
                        d.timeUsed || "Not recorded";


                    // If old submission only has
                    // timeUsedSeconds

                    if (
                        !d.timeUsed &&
                        typeof d.timeUsedSeconds === "number"
                    ) {

                        const totalSeconds =
                            d.timeUsedSeconds;


                        const minutes =
                            Math.floor(
                                totalSeconds / 60
                            );


                        const seconds =
                            totalSeconds % 60;


                        timeUsed =
                            `${minutes} min ${String(
                                seconds
                            ).padStart(2, "0")} sec`;

                    }


                    // ==================================
                    // CARD HTML
                    // ==================================

                    card.innerHTML = `

                        <h3>

                            ${escapeHTML(
                                d.participant ||
                                "Participant"
                            )}

                        </h3>


                        <div class="submission-info">

                            <div class="info-box">

                                <span>
                                    Email
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        d.email || "-"
                                    )}
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    Time Used
                                </span>

                                <strong class="time-used">

                                    ⏱️
                                    ${escapeHTML(
                                        timeUsed
                                    )}

                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    Submitted
                                </span>

                                <strong>

                                    ${escapeHTML(
                                        formatDate(
                                            d.submittedAt
                                        )
                                    )}

                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    Status
                                </span>

                                <strong>

                                    ${escapeHTML(
                                        d.status ||
                                        "Submitted"
                                    )}

                                </strong>

                            </div>

                        </div>


                        <div style="margin-top:20px;">

                            <strong>
                                Design Prompt
                            </strong>

                            <p
                                style="
                                    margin-top:8px;
                                    color:#cbd5e1;
                                    line-height:1.6;
                                "
                            >

                                ${escapeHTML(
                                    d.prompt || "-"
                                )}

                            </p>

                        </div>


                        <img

                            src="${escapeAttribute(
                                d.image || ""
                            )}"

                            class="design-image"

                            alt="Submitted Design"

                        >


                        <div class="submission-actions">

                            <a
                                href="${escapeAttribute(
                                    d.image || ""
                                )}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                <button
                                    class="btn btn-secondary"
                                >
                                    View Design
                                </button>

                            </a>


                            <button

                                class="btn btn-danger delete-btn"

                                data-id="${designDoc.id}"

                            >

                                Delete

                            </button>

                        </div>

                    `;


                    submissions.appendChild(
                        card
                    );

                }
            );


            // ==================================
            // DELETE BUTTONS
            // ==================================

            document
                .querySelectorAll(
                    ".delete-btn"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            async function() {

                                const id =
                                    button.getAttribute(
                                        "data-id"
                                    );


                                const ok =
                                    confirm(
                                        "Delete this submission?"
                                    );


                                if (!ok) {

                                    return;

                                }


                                button.disabled =
                                    true;


                                button.innerText =
                                    "Deleting...";


                                try {

                                    await deleteDoc(

                                        doc(
                                            db,
                                            "submissions",
                                            id
                                        )

                                    );


                                    await loadSubmissions();

                                }

                                catch(error) {

                                    console.error(
                                        error
                                    );


                                    alert(
                                        "Failed to delete submission."
                                    );


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Delete";

                                }

                            }
                        );

                    }
                );

        }


        catch(error) {

            console.error(
                "Submissions error:",
                error
            );


            submissions.innerHTML = `

                <p>

                    Failed to load submissions.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </p>

            `;

        }

    }


    // ==========================================
    // FORMAT DATE
    // ==========================================

    function formatDate(value) {

        if (!value) {
            return "-";
        }


        try {

            return new Date(
                value
            ).toLocaleString();

        }

        catch {

            return value;

        }

    }


    // ==========================================
    // REFRESH DATA
    // ==========================================

    async function refreshData() {

        refreshBtn.disabled =
            true;


        refreshBtn.innerText =
            "Refreshing...";


        try {

            await Promise.all([

                loadUsers(),

                loadSubmissions()

            ]);

        }

        finally {

            refreshBtn.disabled =
                false;


            refreshBtn.innerText =
                "Refresh Data";

        }

    }


    // ==========================================
    // REFRESH BUTTON
    // ==========================================

    refreshBtn.addEventListener(
        "click",
        refreshData
    );


    // ==========================================
    // LOGOUT
    // ==========================================

    logoutBtn.addEventListener(
        "click",
        async function() {

            const ok =
                confirm(
                    "Logout from admin dashboard?"
                );


            if (!ok) {

                return;

            }


            try {

                await signOut(auth);


                localStorage.removeItem(
                    "adminLoggedIn"
                );


                localStorage.removeItem(
                    "adminEmail"
                );


                window.location.href =
                    "admin-login.html";

            }


            catch(error) {

                console.error(
                    "Logout error:",
                    error
                );


                alert(
                    "Logout failed."
                );

            }

        }
    );


    // ==========================================
    // SECURITY HELPERS
    // ==========================================

    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    function escapeAttribute(value) {

        return String(value)

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }

</script>

</body>
