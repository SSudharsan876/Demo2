<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prompt Forge | Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">⚡</div>

        <h1>Prompt Forge</h1>

        <p>Admin Login</p>


        <input
            type="text"
            id="username"
            placeholder="Admin Username"
        >


        <input
            type="password"
            id="password"
            placeholder="Admin Password"
        >


        <button
            class="btn btn-primary"
            onclick="adminLogin()"
        >
            Login
        </button>


        <p id="msg"></p>

    </div>


    <script>

        async function adminLogin() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const msg =
                document.getElementById("msg");


            if (!username || !password) {

                msg.innerText =
                    "Enter username and password";

                return;
            }


            msg.innerText =
                "Connecting to server...";


            try {

                const response = await fetch(
                    "/admin-login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        "Server returned HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                if (data.success) {

                    localStorage.setItem(
                        "admin",
                        "true"
                    );

                    window.location.href =
                        "admin.html";

                } else {

                    msg.innerText =
                        data.message ||
                        "Invalid admin username or password";

                }

            }

            catch (error) {

                console.error(error);

                msg.innerText =
                    "Server connection failed. Make sure server.js is running.";

            }

        }


        // Press Enter to login

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    adminLogin();

                }

            }
        );

    </script>

</body>

</html>
