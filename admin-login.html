<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prompt Forge | Admin Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">


    <!-- ==========================================
         HEADER
    =========================================== -->

    <div class="workspace-header">

        <div>

            <span class="badge">
                Admin Panel
            </span>

            <h1>
                Prompt Forge Dashboard
            </h1>

            <p>
                Approve participants and review
                submitted AI designs.
            </p>

            <p
                id="adminEmail"
                style="font-size:14px;"
            >
                Checking authentication...
            </p>

        </div>


        <div
            style="
                display:flex;
                gap:10px;
                flex-wrap:wrap;
            "
        >

            <button
                id="refreshBtn"
                class="btn btn-primary"
            >
                Refresh Data
            </button>


            <button
                id="logoutBtn"
                class="btn btn-danger"
            >
                Logout
            </button>

        </div>

    </div>


    <hr>


    <!-- ==========================================
         PARTICIPANTS
    =========================================== -->

    <h2>
        Participant Approval
    </h2>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>Name</th>

                    <th>College</th>

                    <th>Department</th>

                    <th>Email</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="table">

                <tr>

                    <td colspan="6">
                        Checking Firebase...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <hr>


    <!-- ==========================================
         SUBMITTED DESIGNS
    =========================================== -->

    <h2>
        Submitted Designs
    </h2>


    <div id="submissions">

        <p>
            Checking Firebase...
        </p>

    </div>


</div>



<!-- ==========================================
     FIREBASE + DASHBOARD
=========================================== -->

<script type="module">

    console.log("Dashboard JavaScript started.");



    // ==========================================
    // FIREBASE IMPORT
    // ==========================================

    let auth;
    let db;

    try {

        const firebase =
            await import("./firebase.js");

        auth = firebase.auth;
        db = firebase.db;

        console.log(
            "Firebase module loaded successfully."
        );

    }

    catch(error) {

        console.error(
            "Firebase import failed:",
            error
        );


        document.getElementById(
            "table"
        ).innerHTML = `

            <tr>

                <td colspan="6">

                    <strong>
                        Firebase failed to load.
                    </strong>

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                    <br><br>

                    Make sure firebase.js is
                    in the same folder as
                    admin-dashboard.html.

                </td>

            </tr>

        `;


        throw error;

    }



    // ==========================================
    // FIREBASE AUTH IMPORT
    // ==========================================

    const {
        onAuthStateChanged,
        signOut
    } =
    await import(
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
    );



    // ==========================================
    // FIRESTORE IMPORT
    // ==========================================

    const {
        collection,
        getDocs,
        doc,
        updateDoc,
        deleteDoc
    } =
    await import(
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    );



    // ==========================================
    // ADMIN EMAIL
    // ==========================================

    const ADMIN_EMAIL =
        "promptforgeadmin@gmail.com";



    // ==========================================
    // ELEMENTS
    // ==========================================

    const table =
        document.getElementById("table");


    const submissions =
        document.getElementById("submissions");


    const refreshBtn =
        document.getElementById("refreshBtn");


    const logoutBtn =
        document.getElementById("logoutBtn");


    const adminEmail =
        document.getElementById("adminEmail");



    // ==========================================
    // AUTHENTICATION
    // ==========================================

    onAuthStateChanged(
        auth,
        async function(user) {

            console.log(
                "Authentication state:",
                user
            );


            // User is NOT logged in

            if (!user) {

                console.log(
                    "No authenticated user."
                );


                adminEmail.innerText =
                    "Not logged in";


                table.innerHTML = `

                    <tr>

                        <td colspan="6">

                            You are not logged in.

                            <br><br>

                            Redirecting to admin login...

                        </td>

                    </tr>

                `;


                setTimeout(
                    function() {

                        window.location.href =
                            "admin-login.html";

                    },
                    1500
                );


                return;

            }



            // ==================================
            // ADMIN CHECK
            // ==================================

            console.log(
                "Logged in email:",
                user.email
            );


            adminEmail.innerText =
                "Logged in as: " +
                user.email;



            if (
                user.email.toLowerCase() !==
                ADMIN_EMAIL.toLowerCase()
            ) {

                console.error(
                    "Unauthorized user:",
                    user.email
                );


                table.innerHTML = `

                    <tr>

                        <td colspan="6">

                            <strong>
                                Access denied.
                            </strong>

                            <br><br>

                            This account is not
                            authorized as an admin.

                        </td>

                    </tr>

                `;


                alert(
                    "You are not authorized to access the admin dashboard."
                );


                await signOut(auth);


                window.location.href =
                    "admin-login.html";


                return;

            }



            // ==================================
            // LOAD DASHBOARD
            // ==================================

            console.log(
                "Admin authenticated."
            );


            await refreshData();

        }
    );



    // ==========================================
    // LOAD PARTICIPANTS
    // ==========================================

    async function loadUsers() {

        console.log(
            "Loading participants..."
        );


        table.innerHTML = `

            <tr>

                <td colspan="6">
                    Loading participants...
                </td>

            </tr>

        `;


        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "users"
                    )
                );


            console.log(
                "Users found:",
                snapshot.size
            );


            table.innerHTML = "";


            if (
                snapshot.empty
            ) {

                table.innerHTML = `

                    <tr>

                        <td colspan="6">

                            No participants
                            registered yet.

                        </td>

                    </tr>

                `;


                return;

            }



            // ==================================
            // CREATE USER ROWS
            // ==================================

            snapshot.forEach(
                function(userDoc) {

                    const u =
                        userDoc.data();


                    const approved =
                        u.emailApproved === true;


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            ${escapeHTML(
                                u.fullName || ""
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                u.college || ""
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                u.department || ""
                            )}
                        </td>


                        <td>
                            ${escapeHTML(
                                u.email || ""
                            )}
                        </td>


                        <td>

                            <strong>

                                ${
                                    approved
                                    ? "Approved"
                                    : "Pending"
                                }

                            </strong>

                        </td>


                        <td
                            class="action-buttons"
                        >


                            <!-- APPROVE -->

                            <button

                                class="${
                                    approved
                                    ? "btn btn-secondary"
                                    : "btn btn-primary"
                                } approve-btn"

                                data-id="${userDoc.id}"

                                ${
                                    approved
                                    ? "disabled"
                                    : ""
                                }

                            >

                                ${
                                    approved
                                    ? "Approved"
                                    : "Approve"
                                }

                            </button>



                            <!-- DELETE -->

                            <button

                                class="
                                    btn
                                    btn-danger
                                    delete-participant-btn
                                "

                                data-id="${userDoc.id}"

                                style="
                                    margin-left:8px;
                                "

                            >

                                Delete

                            </button>


                        </td>

                    `;


                    table.appendChild(
                        row
                    );

                }
            );



            // ==================================
            // APPROVE BUTTONS
            // ==================================

            document
                .querySelectorAll(
                    ".approve-btn"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            async function() {

                                const id =
                                    button.dataset.id;


                                console.log(
                                    "Approving user:",
                                    id
                                );


                                button.disabled =
                                    true;


                                button.innerText =
                                    "Approving...";


                                try {

                                    await updateDoc(

                                        doc(
                                            db,
                                            "users",
                                            id
                                        ),

                                        {
                                            emailApproved:
                                                true
                                        }

                                    );


                                    console.log(
                                        "User approved:",
                                        id
                                    );


                                    await loadUsers();


                                }

                                catch(error) {

                                    console.error(
                                        "Approval error:",
                                        error
                                    );


                                    alert(
                                        "Approval failed:\n\n" +
                                        error.message
                                    );


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Approve";

                                }

                            }
                        );

                    }
                );



            // ==================================
            // DELETE PARTICIPANT
            // ==================================

            document
                .querySelectorAll(
                    ".delete-participant-btn"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            async function() {

                                const id =
                                    button.dataset.id;


                                const row =
                                    button.closest("tr");


                                const name =
                                    row
                                    ?.children[0]
                                    ?.innerText
                                    ||
                                    "this participant";


                                const confirmed =
                                    confirm(
                                        "Delete " +
                                        name +
                                        "?"
                                    );


                                if (!confirmed) {

                                    return;

                                }


                                button.disabled =
                                    true;


                                button.innerText =
                                    "Deleting...";


                                try {

                                    await deleteDoc(

                                        doc(
                                            db,
                                            "users",
                                            id
                                        )

                                    );


                                    console.log(
                                        "Participant deleted:",
                                        id
                                    );


                                    await loadUsers();


                                }

                                catch(error) {

                                    console.error(
                                        "Delete participant error:",
                                        error
                                    );


                                    alert(
                                        "Delete failed:\n\n" +
                                        error.message
                                    );


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Delete";

                                }

                            }
                        );

                    }
                );

        }

        catch(error) {

            console.error(
                "LOAD USERS ERROR:",
                error
            );


            table.innerHTML = `

                <tr>

                    <td colspan="6">

                        <strong>
                            Failed to load participants.
                        </strong>

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </td>

                </tr>

            `;

        }

    }



    // ==========================================
    // LOAD SUBMISSIONS
    // ==========================================

    async function loadSubmissions() {

        console.log(
            "Loading submissions..."
        );


        submissions.innerHTML = `

            <p>
                Loading submitted designs...
            </p>

        `;


        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "submissions"
                    )
                );


            console.log(
                "Submissions found:",
                snapshot.size
            );


            submissions.innerHTML = "";


            if (
                snapshot.empty
            ) {

                submissions.innerHTML = `

                    <p>
                        No designs submitted yet.
                    </p>

                `;


                return;

            }



            snapshot.forEach(
                function(designDoc) {

                    const d =
                        designDoc.data();


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "design-card";


                    card.style.cssText = `

                        margin-top:20px;
                        background:#334155;
                        padding:20px;
                        border-radius:12px;

                    `;


                    card.innerHTML = `

                        <h3>

                            ${escapeHTML(
                                d.participant ||
                                "Participant"
                            )}

                        </h3>


                        <p>

                            <b>Email:</b>

                            ${escapeHTML(
                                d.email || ""
                            )}

                        </p>


                        <p>

                            <b>Prompt:</b>

                            ${escapeHTML(
                                d.prompt || ""
                            )}

                        </p>


                        <p>

                            <b>Submitted:</b>

                            ${escapeHTML(
                                d.submittedAt || ""
                            )}

                        </p>


                        <img

                            src="${escapeAttribute(
                                d.image || ""
                            )}"

                            style="
                                width:300px;
                                max-width:100%;
                                border-radius:10px;
                                display:block;
                                margin-top:15px;
                            "

                            alt="Submitted Design"

                        >


                        <br>


                        <a

                            href="${escapeAttribute(
                                d.image || ""
                            )}"

                            target="_blank"

                            rel="noopener noreferrer"

                        >

                            <button
                                class="btn btn-secondary"
                            >
                                View Design
                            </button>

                        </a>


                        <button

                            class="
                                btn
                                btn-danger
                                delete-submission-btn
                            "

                            data-id="${designDoc.id}"

                            style="
                                margin-left:8px;
                            "

                        >

                            Delete

                        </button>

                    `;


                    submissions.appendChild(
                        card
                    );

                }
            );



            // ==================================
            // DELETE SUBMISSIONS
            // ==================================

            document
                .querySelectorAll(
                    ".delete-submission-btn"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            async function() {

                                const id =
                                    button.dataset.id;


                                const confirmed =
                                    confirm(
                                        "Delete this submission?"
                                    );


                                if (!confirmed) {

                                    return;

                                }


                                button.disabled =
                                    true;


                                button.innerText =
                                    "Deleting...";


                                try {

                                    await deleteDoc(

                                        doc(
                                            db,
                                            "submissions",
                                            id
                                        )

                                    );


                                    await loadSubmissions();

                                }

                                catch(error) {

                                    console.error(
                                        "Delete submission error:",
                                        error
                                    );


                                    alert(
                                        "Delete failed:\n\n" +
                                        error.message
                                    );


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Delete";

                                }

                            }
                        );

                    }
                );

        }

        catch(error) {

            console.error(
                "LOAD SUBMISSIONS ERROR:",
                error
            );


            submissions.innerHTML = `

                <p>

                    <strong>
                        Failed to load submissions.
                    </strong>

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </p>

            `;

        }

    }



    // ==========================================
    // REFRESH
    // ==========================================

    async function refreshData() {

        console.log(
            "Refreshing dashboard..."
        );


        refreshBtn.disabled =
            true;


        refreshBtn.innerText =
            "Refreshing...";


        try {

            await Promise.all([
                loadUsers(),
                loadSubmissions()
            ]);

        }

        catch(error) {

            console.error(
                "Refresh error:",
                error
            );

        }

        finally {

            refreshBtn.disabled =
                false;


            refreshBtn.innerText =
                "Refresh Data";

        }

    }



    // ==========================================
    // REFRESH BUTTON
    // ==========================================

    refreshBtn.addEventListener(
        "click",
        refreshData
    );



    // ==========================================
    // LOGOUT
    // ==========================================

    logoutBtn.addEventListener(
        "click",
        async function() {

            const confirmed =
                confirm(
                    "Logout from admin dashboard?"
                );


            if (!confirmed) {

                return;

            }


            try {

                await signOut(auth);


                window.location.href =
                    "admin-login.html";

            }

            catch(error) {

                console.error(
                    "Logout error:",
                    error
                );


                alert(
                    "Logout failed:\n\n" +
                    error.message
                );

            }

        }
    );



    // ==========================================
    // SECURITY HELPERS
    // ==========================================

    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }



    function escapeAttribute(value) {

        return String(value)

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


</script>


</body>

</html>
