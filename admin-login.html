<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prompt Forge | Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">

    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
            ⚡
        </div>


        <!-- Heading -->
        <h1>
            Prompt Forge
        </h1>


        <p>
            Admin Login
        </p>


        <!-- Admin Email -->
        <input
            type="email"
            id="adminEmail"
            placeholder="Admin Email"
            autocomplete="username"
            required
        >


        <!-- Admin Password -->
        <input
            type="password"
            id="adminPassword"
            placeholder="Password"
            autocomplete="current-password"
            required
        >


        <!-- Login -->
        <button
            class="btn btn-primary"
            id="adminLoginBtn"
            onclick="adminLogin()"
        >
            Login as Admin
        </button>


        <!-- Message -->
        <p id="adminMsg"></p>


        <!-- Back -->
        <p class="auth-link">

            <a href="login.html">
                ← Back to Participant Login
            </a>

        </p>

    </div>


    <!-- ==========================================
         FIREBASE ADMIN AUTHENTICATION
    =========================================== -->

    <script type="module">

        import {
            auth
        }
        from "./firebase.js";


        import {
            signInWithEmailAndPassword
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        // ==========================================
        // ADMIN LOGIN
        // ==========================================

        window.adminLogin = async function () {

            const email =
                document
                    .getElementById("adminEmail")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("adminPassword")
                    .value;


            const button =
                document.getElementById(
                    "adminLoginBtn"
                );


            const message =
                document.getElementById(
                    "adminMsg"
                );


            // Empty fields

            if (!email || !password) {

                message.innerText =
                    "Enter admin email and password";

                return;
            }


            button.disabled = true;

            button.innerText =
                "Signing in...";


            message.innerText = "";


            try {

                // Firebase Authentication

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                // ==========================================
                // CHECK ADMIN EMAIL
                // ==========================================

                if (
                    user.email !==
                    "admin@aiprompt.com"
                ) {

                    await auth.signOut();


                    message.innerText =
                        "This account is not authorized as admin";

                    return;
                }


                // ==========================================
                // ADMIN LOGIN SUCCESS
                // ==========================================

                localStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "adminEmail",
                    user.email
                );


                window.location.href =
                    "admin.html";

            }


            catch (error) {

                console.error(
                    "Admin login error:",
                    error
                );


                // Firebase error messages

                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    message.innerText =
                        "Invalid admin email or password";

                }

                else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    message.innerText =
                        "Admin account not found";

                }

                else if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    message.innerText =
                        "Incorrect password";

                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    message.innerText =
                        "Too many attempts. Try again later";

                }

                else {

                    message.innerText =
                        "Admin login failed: " +
                        error.message;

                }

            }


            finally {

                button.disabled = false;

                button.innerText =
                    "Login as Admin";

            }

        };


        // ==========================================
        // ENTER KEY LOGIN
        // ==========================================

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    adminLogin();

                }

            }
        );

    </script>

</body>

</html>
